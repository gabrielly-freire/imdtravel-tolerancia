x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "curl -fsS http://localhost:$${PORT}/health"]
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 40s

services:
  airlineshub:
    image: gibeonufrn/imdtravel-airlineshub:${IMAGE_TAG:-parte2}
    environment:
      PORT: 8080
      CATALOG_FLIGHTS: ${CATALOG_FLIGHTS:-IMD100,IMD200,IMD300}
      CATALOG_BASE_PRICES: ${CATALOG_BASE_PRICES:-350.50,420.50,510.50}
      CATALOG_PRICE_STEP_PER_DAY: ${CATALOG_PRICE_STEP_PER_DAY:-12.25}
      CATALOG_START_DATE: ${CATALOG_START_DATE:-2026-12-01}
      CATALOG_DAYS: ${CATALOG_DAYS:-7}
      CATALOG_SEATS: ${CATALOG_SEATS:-20}
      SELL_MIN_MS: ${SELL_MIN_MS:-300}
      SELL_MAX_MS: ${SELL_MAX_MS:-900}
      # Injeção de falhas (FALHAS.md). Tipos fixos: /flight = Tempo,
      # /sell = Omissão. _P = probabilidade por requisição; _TTL_SEC = duração da falha.
      FAULT_FLIGHT_P: ${FAULT_FLIGHT_P:-0}
      FAULT_FLIGHT_TTL_SEC: ${FAULT_FLIGHT_TTL_SEC:-0}
      FAULT_SELL_P: ${FAULT_SELL_P:-0}
      FAULT_SELL_TTL_SEC: ${FAULT_SELL_TTL_SEC:-0}
    healthcheck: *healthcheck
    networks:
      - imdtravel-net

  exchange:
    image: gibeonufrn/imdtravel-exchange:${IMAGE_TAG:-parte2}
    environment:
      PORT: 8080
      EXCHANGE_INITIAL_RATE: ${EXCHANGE_INITIAL_RATE:-5.50}
      EXCHANGE_TICK_S: ${EXCHANGE_TICK_S:-10}
      EXCHANGE_MAX_STEP_PCT: ${EXCHANGE_MAX_STEP_PCT:-0.3}
      EXCHANGE_MIN: ${EXCHANGE_MIN:-5.00}
      EXCHANGE_MAX: ${EXCHANGE_MAX:-6.00}
      # Injeção de falhas. Tipo fixo: /convert = Resposta.
      FAULT_CONVERT_P: ${FAULT_CONVERT_P:-0}
      FAULT_CONVERT_TTL_SEC: ${FAULT_CONVERT_TTL_SEC:-0}
    healthcheck: *healthcheck
    networks:
      - imdtravel-net

  fidelity:
    image: gibeonufrn/imdtravel-fidelity:${IMAGE_TAG:-parte2}
    environment:
      PORT: 8080
      # Injeção de falhas. Tipo fixo: /bonus = Crash.
      FAULT_BONUS_P: ${FAULT_BONUS_P:-0}
      FAULT_BONUS_TTL_SEC: ${FAULT_BONUS_TTL_SEC:-0}
    healthcheck: *healthcheck
    networks:
      - imdtravel-net

  imdtravel:
    build: ./imdtravel
    environment:
      PORT: 8080
      SALES_DIR: /data
      AIRLINESHUB_URL: http://airlineshub:8080
      EXCHANGE_URL: http://exchange:8080
      FIDELITY_URL: http://fidelity:8080
      RATE_MIN: ${RATE_MIN:-5.0}
      RATE_MAX: ${RATE_MAX:-6.0}
      PRICE_CACHE_MAX_AGE_MS: ${PRICE_CACHE_MAX_AGE_MS:-600000}
      RATE_CACHE_MAX_AGE_MS: ${RATE_CACHE_MAX_AGE_MS:-60000}
      TIMEOUT_FLIGHT_MS: ${TIMEOUT_FLIGHT_MS:-1400}
      TIMEOUT_CONVERT_MS: ${TIMEOUT_CONVERT_MS:-700}
      TIMEOUT_SELL_MS: ${TIMEOUT_SELL_MS:-1600}
      TIMEOUT_BONUS_MS: ${TIMEOUT_BONUS_MS:-1100}
      DEADLINE_TOTAL_MS: ${DEADLINE_TOTAL_MS:-4500}
      CB_FAILURE_RATE_THRESHOLD: ${CB_FAILURE_RATE_THRESHOLD:-50}
      CB_SLIDING_WINDOW_SIZE: ${CB_SLIDING_WINDOW_SIZE:-6}
      CB_MINIMUM_NUMBER_OF_CALLS: ${CB_MINIMUM_NUMBER_OF_CALLS:-3}
      CB_WAIT_DURATION_OPEN_MS: ${CB_WAIT_DURATION_OPEN_MS:-5000}
      CB_HALF_OPEN_PERMITTED_CALLS: ${CB_HALF_OPEN_PERMITTED_CALLS:-1}
    ports:
      - "${IMDTRAVEL_HOST_PORT:-8080}:8080"
    volumes:
      - sales-data:/data
    healthcheck: *healthcheck
    depends_on:
      airlineshub: { condition: service_healthy }
      exchange:    { condition: service_healthy }
      fidelity:    { condition: service_healthy }
    networks:
      - imdtravel-net

networks:
  imdtravel-net:
    driver: bridge

volumes:
  sales-data:
