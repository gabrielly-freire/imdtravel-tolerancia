spring.application.name=imdtravel
server.port=${PORT:8080}

imdtravel.airlineshub-url=${AIRLINESHUB_URL:http://airlineshub:8080}
imdtravel.exchange-url=${EXCHANGE_URL:http://exchange:8080}
imdtravel.fidelity-url=${FIDELITY_URL:http://fidelity:8080}
imdtravel.sales-dir=${SALES_DIR:/data}

imdtravel.resilience.timeout-flight-ms=${TIMEOUT_FLIGHT_MS:1400}
imdtravel.resilience.timeout-convert-ms=${TIMEOUT_CONVERT_MS:700}
imdtravel.resilience.timeout-sell-ms=${TIMEOUT_SELL_MS:1600}
imdtravel.resilience.timeout-bonus-ms=${TIMEOUT_BONUS_MS:1100}
imdtravel.resilience.deadline-total-ms=${DEADLINE_TOTAL_MS:4500}
imdtravel.resilience.cb-failure-rate-threshold=${CB_FAILURE_RATE_THRESHOLD:50}
imdtravel.resilience.cb-sliding-window-size=${CB_SLIDING_WINDOW_SIZE:6}
imdtravel.resilience.cb-minimum-number-of-calls=${CB_MINIMUM_NUMBER_OF_CALLS:3}
imdtravel.resilience.cb-wait-duration-open-ms=${CB_WAIT_DURATION_OPEN_MS:5000}
imdtravel.resilience.cb-half-open-permitted-calls=${CB_HALF_OPEN_PERMITTED_CALLS:1}
